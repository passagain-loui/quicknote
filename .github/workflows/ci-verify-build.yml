name: CI — Test, Verify & Build QuickNote

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run full test suite
      run: |
        python -m pytest tests/ -v --tb=short --color=yes 2>&1 | tee test_results.log

    - name: Extract test results
      id: test_results
      run: |
        $output = Get-Content test_results.log | Select-String "passed|failed" | Select-Object -Last 1
        Write-Output "summary=$output" >> $env:GITHUB_OUTPUT

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: test_results.log

  build-exe:
    needs: test-and-verify
    runs-on: windows-latest
    if: success()

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Get version
      id: version
      run: |
        $version = python -c "from src.core.constants import APP_VERSION; print(APP_VERSION)"
        Write-Output "number=$version" >> $env:GITHUB_OUTPUT

    - name: Build Windows executable
      run: python build_windows.py

    - name: Verify executable exists
      run: |
        if (Test-Path "dist/QuickNote_v*.exe") {
          Write-Output "✅ Executable built successfully"
          Get-Item "dist/QuickNote_*.exe" | ForEach-Object { Write-Output "Size: $($_.Length / 1MB) MB" }
        } else {
          Write-Output "❌ Executable not found!"
          exit 1
        }

    - name: Upload executable to artifacts
      uses: actions/upload-artifact@v4
      with:
        name: quicknote-exe
        path: dist/QuickNote_*.exe
        retention-days: 30

    - name: Create GitHub Release (on version tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/QuickNote_*.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
